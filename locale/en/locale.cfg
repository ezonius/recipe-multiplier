[mod-setting-description]
re-amount-multiplier=The default multiplier used for every recipe this mod scales: one craft produces X times as much, consumes X times as many ingredients, and takes X times as long. Machine throughput (items per minute) stays the same — each craft is just a bigger batch, which saves crafting animations, robot delivery trips and so on.\nDefault multiplier for entries without an explicit "=number".\nRecycling recipes are handled separately — see "Recycling recipes inherit their source item's multiplier", or use a "recycling=<multiplier>" entry in the Item types setting. Recipes with non-stackable items (e.g. asteroid chunks) are handled specially — see the "Scale recipes with mixed stackability products" setting.

re-recycling-inherit-source=When on, a recycling recipe (e.g. "iron-plate-recycling") whose source item was scaled with an explicit "name=number" entry (e.g. "iron-plate=100" in "Item/Recipe names") inherits that same multiplier.\nWhen the source item was not explicitly scaled, the normal criteria decide (e.g. a "recycling=<multiplier>" entry in "Item types").

re-enable-type=Criterion 1 of 3: scale recipes by the "type" of the thing they produce.\nA "type" here is a prototype group in data.raw — e.g. "item", "tool", "module", "ammo" — listed in the setting below. Every scalable prototype of that group gets its recipe scaled. The special type "recipe" scales every recipe in the game (for which all items resolve to stackable prototypes).\nA recipe matched here is scaled once, and only if no higher-priority criterion (see below) already claimed it. Priority: Item types first, then Item/Recipe names, then Recipe sub groups.

re-item-types=Which prototype groups ("types") to scale, comma separated. Optionally give a per-type multiplier, e.g. "item=100, tool". Entries without "=number" use the main Recipe amount multiplier.\nEvery prototype inside that type gets its recipe scaled.\nAn entry that names a recipe category instead (e.g. "recycling" or "macerating") scales every recipe belonging to that category — this is the recommended way to target recycling recipes.\nUse ctrl+shift+F while hovering an item in game to see its type (shown as "Prototype type").\nA list of all item/recipe names and item types can be found here: https://wiki.factorio.com/Data.raw

re-enable-name=Criterion 2 of 3: scale recipes by the internal name of the item or recipe.\nEntries listed below are scaled even if they are also matched by Item types (names override the type's multiplier, because names are checked first). This criterion wins over Recipe sub groups, which is why recipes named below can be excluded from sub-group scaling by simply listing them.

re-item-names=Which items (or recipes) to scale, comma separated. Optionally give a per-item multiplier, e.g. "iron-plate=100, copper-plate". Entries without "=number" use the main Recipe amount multiplier.\nThese are internal names (the same string you see with ctrl+shift+F in game), usually identical to the item's English name in lowercase with dashes. The recipe of an item is the recipe that produces it — recipes normally share the name of their main product, so scaling "iron-plate" scales the "iron-plate" recipe.\nA list of all item/recipe names and item types can be found here: https://wiki.factorio.com/Data.raw#recipe

re-enable-subgroup=Criterion 3 of 3: scale recipes by their recipe sub group — the crafting category a recipe belongs to (e.g. "crafting", "smelting", "chemistry"), not the item's type or inventory category.\nThis criterion is checked last: it only scales recipes that were not already claimed by Item types or Item/Recipe names, and recipes whose name appears in the Item/Recipe names list are skipped entirely. This makes sub groups a convenient "scale everything except the handful I named" switch.

re-sub-groups=Which recipe sub groups to scale, comma separated. Optionally give a per-group multiplier, e.g. "smelting=20, chemistry". Entries without "=number" use the main Recipe amount multiplier.\nUse ctrl+shift+F on a crafted item in game to look up the recipe's sub group ("Subgroup" field). Common vanilla sub groups: "crafting", "advanced-crafting", "smelting", "chemistry", "metallurgy", "electronics".

re-enable-add-recipe=When off, the original recipes are overwritten with their scaled versions (this is the standard "batch crafting" setup).\nWhen on, the original recipes are left untouched and each one instead gains an extra copy named "<recipe>-bulk" with the multiplier applied — so e.g. assembling machines can craft the small original recipe and big "-bulk" recipe side by side, and you choose per production line which one to use.

re-fluid-flow-multiplier=Multiplies the internal fluid volume of assembling machines and furnaces by this amount. Fluids are transferred faster per tick this way... Fluid throughput quickly becomes a bottleneck with machines that have very high crafting speed — increasing this helps fluids get transferred to (and out of) the machines quicker, so machines don't starve on fluid input.\nAlso affects the cargo pod inventory (x100) so large batch deliveries fit.
re-scale-mixed-nonstackable=When on, recipes that produce a MIX of stackable and non-stackable items (e.g. oxide-asteroid-crushing: ice + oxide-asteroid-chunk) are still scaled — the stackable products are multiplied, while non-stackable product entries keep their original count of at most 1 per craft.\nWhen off (the old behaviour), any recipe containing a non-stackable item that cannot be batched is skipped entirely. Recipes whose products are ALL non-stackable (e.g. asteroid chunk upcycling) are always skipped either way, since scaling them would only multiply time and ingredients for the same output.

re-probability-handling=How products with a probability below 100% (e.g. oxide-asteroid-crushing: 30% chance for an ice chunk) are scaled.\n"Multiply the output amount" (default): the chance stays the same, but when it triggers it outputs X times as much — 30% chance of 1 with multiplier 11 becomes 30% chance of 11.\n"Convert to expected value": the expected output per batch stays exactly proportional — 30% chance of 1 with multiplier 11 becomes a guaranteed 3, plus a 30% chance of 1 extra. Less spiky, but the guaranteed part always drops, so unlucky streaks are impossible (and lucky streaks smaller).

re-min-crafting-time=Minimum crafting time in seconds for every recipe targeted by the Item type / Item name / Sub group criteria. Recipes whose crafting time (energy_required) is below this are scaled further — with integer multipliers only — until the crafting time reaches this minimum: e.g. a 3.2 s recipe with a minimum of 30 s is scaled by ceil(30 / 3.2) = 10, giving a 32 s batch. If the configured multiplier already makes the crafting time reach the minimum, the bigger of the two multipliers is used, so this never shrinks a batch.
0 disables the feature (default).\nRecipes with an explicit "name=number" multiplier (e.g. iron-plate=100) are exempt and keep their exact multiplier. The time-based minimum is applied on top of the recycling multiplier as well.

re-min-crafting-time-category-explicit=When on, recipes explicitly claimed through a recipe-category entry in "Item types" (e.g. "recycling=10") are NOT exempt from the minimum crafting time — the time-based minimum can raise their effective multiplier above the category's stated value.\nWhen off, all explicit "name=number" entries (including recipe-category entries) are fully exempt, preserving the older behaviour where "recycling=10" always wins over the minimum.

[command-help]
recipe-multiplier-startup-log=Re-print the notable Recipe Multiplier startup messages (warnings, skipped recipes, errors) from the last data stage.
