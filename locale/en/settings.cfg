re-amount-multiplier=Recipe amount multiplier
re-enable-type=Apply multiplier to Item types
re-item-types=Item types:
re-enable-name=Apply multiplier to Item names
re-item-names=Item names:
re-enable-add-recipe=Add recipe instead of changing the existing recipe
re-fluid-flow-multiplier=Fluid flow multiplier
[mod-setting-description]
re-amount-multiplier=Set the multiplier for the amount of ingredients in a recipe.
re-enable-type=Toggle this to modify stack sizes using item types.
re-item-types=Write item types to be modified. Use ctrl+shift+f on an item in the game to look up its type.\nA list of item/recipe names and item types can be found here: https://wiki.factorio.com/Data.raw
re-enable-name=Toggle this to modify stack sizes using item names.
re-item-names=Write item/recipe names to be modified. Use ctrl+shift+f on an item in the game to look up its name.\nA list of item/recipe names and item types can be found here: https://wiki.factorio.com/Data.raw#recipe
re-enable-add-recipe=This will keep the existing recipe intact, but add a new recipe with the multiplier applied.
re-fluid-flow-multiplier=Fluids are transferred faster pr tick.. Fluids quickly become a bottleneck if you have machines with very high crafting speed. Increasing this, will help fluids get transferred to the machines quicker
